name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/actions/**'
      - '.github/codeql-filters.json'
      - '*'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/actions/**'
      - '.github/codeql-filters.json'
      - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CodeQL inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Validate matrix selection
        run: node --test scripts/codeql-matrix.test.mjs
      - uses: dorny/paths-filter@v3
        id: paths
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.ref }}
          # JSON is valid YAML and keeps this config easy to inspect with Node.
          filters: .github/codeql-filters.json
      - name: Select analyses
        id: matrix
        env:
          CHANGED_FILTERS: ${{ steps.paths.outputs.changes || '[]' }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/codeql-matrix.mjs

  analyze:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    name: Analyze (${{ matrix.language }}${{ matrix.platform && format(' / {0}', matrix.platform) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Select result destination
        id: results
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          upload=always
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if [ -z "$(git ls-tree --name-only "$BASE_SHA" -- .github/workflows/codeql.yml)" ]; then
              # The introducing PR must coexist with GitHub's default setup.
              # Subsequent PRs and all main/scheduled runs upload normally.
              upload=never
              echo 'Initial workflow validation: analysis results are saved as artifacts. After merge, switch from default to advanced CodeQL setup.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        if: matrix.build-mode == 'manual'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # iOS already uses FlutterImplicitEngineDelegate (UIScene lifecycle).
          # Keep the existing SDK for Android/macOS; match the migrated iOS code.
          flutter-version: ${{ matrix.platform == 'ios' && '3.41.0' || '3.35.4' }}
      - name: Install Dashboard dependencies
        if: matrix.build-mode == 'manual'
        working-directory: apps/dashboard
        run: flutter pub get
      # CocoaPods dependencies must be installed before CodeQL starts tracing.
      # Config-only generates Flutter's Xcode settings without compiling Swift.
      - name: Prepare iOS project
        if: matrix.platform == 'ios'
        working-directory: apps/dashboard
        run: |
          flutter build ios --config-only --no-codesign --debug
          (cd ios && pod install)
      - name: Prepare macOS project
        if: matrix.platform == 'macos'
        working-directory: apps/dashboard
        run: |
          flutter build macos --config-only --debug
          (cd macos && pod install)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Android for Kotlin analysis
        if: matrix.language == 'java-kotlin'
        working-directory: apps/dashboard
        run: |
          # Keep both Gradle and Kotlin inside CodeQL's traced process tree.
          cat >> android/gradle.properties <<'PROPERTIES'

          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.workers.max=2
          org.gradle.daemon=false
          kotlin.compiler.execution.strategy=in-process
          PROPERTIES
          flutter build apk --debug --target-platform android-arm64
      - name: Build iOS for Swift analysis
        if: matrix.platform == 'ios'
        timeout-minutes: 30
        working-directory: apps/dashboard
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO -jobs 2 build
      - name: Build macOS for Swift analysis
        if: matrix.platform == 'macos'
        timeout-minutes: 30
        working-directory: apps/dashboard
        run: |
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO -jobs 2 build
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}${{ matrix.platform && format('/platform:{0}', matrix.platform) || '' }}
          upload: ${{ steps.results.outputs.upload }}
          output: ${{ runner.temp }}/codeql-results
      - name: Save initial scan results
        if: steps.results.outputs.upload == 'never'
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}${{ matrix.platform && format('-{0}', matrix.platform) || '' }}
          path: ${{ runner.temp }}/codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 7
