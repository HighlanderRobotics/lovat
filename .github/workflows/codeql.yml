name: CodeQL

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect CodeQL inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'
      - name: Validate matrix selection
        run: node --test scripts/codeql-matrix.test.mjs
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: paths
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.ref }}
          # JSON is valid YAML and keeps this config easy to inspect with Node.
          filters: .github/codeql-filters.json
      - name: Select analyses
        id: matrix
        env:
          CHANGED_FILTERS: ${{ steps.paths.outputs.changes || '[]' }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/codeql-matrix.mjs

  analyze:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    name: Analyze (${{ matrix.language }}${{ matrix.platform && format(' / {0}', matrix.platform) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select result destination
        id: results
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          upload=always
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if [ -z "$(git ls-tree --name-only "$BASE_SHA" -- .github/workflows/codeql.yml)" ]; then
              # The introducing PR must coexist with GitHub's default setup.
              # Subsequent PRs and all main/scheduled runs upload normally.
              upload=never
              echo 'Initial workflow validation: analysis results are saved as artifacts. After merge, switch from default to advanced CodeQL setup.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        if: matrix.build-mode == 'manual'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Match Dashboard's tested SDK on every native platform.
          flutter-version: 3.41.0
      - name: Install Dashboard dependencies
        if: matrix.build-mode == 'manual'
        working-directory: apps/dashboard
        run: flutter pub get
      # CocoaPods dependencies must be installed before CodeQL starts tracing.
      # Config-only generates Flutter's Xcode settings without compiling Swift.
      - name: Prepare iOS project
        if: matrix.platform == 'ios'
        working-directory: apps/dashboard
        run: |
          flutter build ios --config-only --no-codesign --debug
          (cd ios && pod install)
      - name: Prepare macOS project
        if: matrix.platform == 'macos'
        working-directory: apps/dashboard
        run: |
          flutter build macos --config-only --debug
          (cd macos && pod install)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Android for Kotlin analysis
        if: matrix.language == 'java-kotlin'
        working-directory: apps/dashboard
        run: |
          # Keep both Gradle and Kotlin inside CodeQL's traced process tree.
          cat >> android/gradle.properties <<'PROPERTIES'

          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.workers.max=2
          org.gradle.daemon=false
          kotlin.compiler.execution.strategy=in-process
          PROPERTIES
          flutter build apk --debug --target-platform android-arm64
      - name: Build iOS for Swift analysis
        if: matrix.platform == 'ios'
        timeout-minutes: 30
        working-directory: apps/dashboard
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO -jobs 2 build
      - name: Build macOS for Swift analysis
        if: matrix.platform == 'macos'
        timeout-minutes: 30
        working-directory: apps/dashboard
        run: |
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO -jobs 2 build
      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}${{ matrix.platform && format('/platform:{0}', matrix.platform) || '' }}
          upload: ${{ steps.results.outputs.upload }}
          output: ${{ runner.temp }}/codeql-results
      - name: Save initial scan results
        if: steps.results.outputs.upload == 'never'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-${{ matrix.language }}${{ matrix.platform && format('-{0}', matrix.platform) || '' }}
          path: ${{ runner.temp }}/codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 7

  result:
    name: Require applicable CodeQL analyses
    if: ${{ always() }}
    needs: [changes, analyze]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      DETECTION_RESULT: ${{ needs.changes.result }}
      ANALYSIS_SELECTED: ${{ needs.changes.outputs.any }}
      ANALYSIS_RESULT: ${{ needs.analyze.result }}
    steps:
      - name: Check scan outcome
        run: |
          test "$DETECTION_RESULT" = success
          case "$ANALYSIS_SELECTED:$ANALYSIS_RESULT" in
            true:success|false:skipped) ;;
            *) echo 'An applicable CodeQL analysis did not succeed.' >&2; exit 1 ;;
          esac
