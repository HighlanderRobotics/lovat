name: Public deployment smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.20.0
      - name: Probe fixed public Lovat endpoints
        run: |
          set -o pipefail
          {
            echo "Smoke runner revision: $GITHUB_SHA"
            node scripts/deployment-smoke.mjs
          } | tee deployment-smoke.log
      - name: Retain smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-smoke.log
          retention-days: 14
          if-no-files-found: warn
