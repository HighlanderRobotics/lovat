name: Railway PR QR Codes

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'apps/server/**'
      - 'apps/worker/**'
      - 'packages/db/**'
      - '.railway/**'
      - '.github/workflows/server-railway-qr-codes.yml'
      - 'scripts/railway_preview_qr*.py'
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

concurrency:
  group: railway-qr-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  post-qr-codes:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event.issue.pull_request &&
       github.event.comment.user.login == 'railway-app[bot]' &&
       contains(github.event.comment.body, 'railway-bot-comment-version'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # This privileged workflow executes only trusted default-branch code.
      # Never check out the PR head or interpolate comment content into a shell.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Generate or update Server API connection QR codes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/railway_preview_qr.py
