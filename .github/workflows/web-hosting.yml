name: Web hosting images
on:
  pull_request:
    paths:
      - 'apps/website/**'
      - 'apps/learn/**'
      - 'apps/dashboard/**'
      - '.github/workflows/web-hosting.yml'
      - 'scripts/test-web-hosting.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [learn, dashboard, website]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image without secrets
        run: docker build --build-arg LOVAT_API_BASE=https://preview-api.invalid --build-arg LOVAT_WEBSITE_URL=https://preview-website.invalid --build-arg PUBLIC_WEBSITE_URL=https://preview-website.invalid -t lovat-web:test apps/${{ matrix.app }}
      - name: Analyze Dashboard with the deployment SDK
        if: matrix.app == 'dashboard'
        run: |
          docker build --target build --build-arg LOVAT_API_BASE=https://preview-api.invalid --build-arg LOVAT_WEBSITE_URL=https://preview-website.invalid -t lovat-dashboard-build:test apps/dashboard
          if docker run --rm lovat-dashboard-build:test flutter analyze > /tmp/dashboard-analysis.log 2>&1; then
            cat /tmp/dashboard-analysis.log
          else
            cat /tmp/dashboard-analysis.log
            # Allow only the documented pre-existing informational diagnostic.
            test "$(grep -Ec ' (info|warning|error) • ' /tmp/dashboard-analysis.log)" -eq 1
            grep -F 'lib/reusable/stale_refresh_builder.dart:143:5 • prefer_conditional_assignment' /tmp/dashboard-analysis.log
            grep -F '1 issue found.' /tmp/dashboard-analysis.log
          fi
      - name: Start production image
        run: docker run -d --name web -p 8080:8080 -e ORIGIN=http://localhost:8080 -e PUBLIC_LEARN_URL=https://preview-learn.invalid -e PUBLIC_DASHBOARD_URL=https://preview-dashboard.invalid -e PUBLIC_WEBSITE_URL=https://preview-website.invalid lovat-web:test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify HTTP behavior
        env:
          EXPECTED_LEARN_URL: https://preview-learn.invalid
          EXPECTED_DASHBOARD_URL: https://preview-dashboard.invalid
          EXPECTED_WEBSITE_URL: https://preview-website.invalid
        run: node scripts/test-web-hosting.mjs ${{ matrix.app }} http://localhost:8080
      - name: Container logs
        if: always()
        run: docker logs web
