name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read
defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      worker: ${{ steps.filter.outputs.worker }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      collection: ${{ steps.filter.outputs.collection }}
      website: ${{ steps.filter.outputs.website }}
      learn: ${{ steps.filter.outputs.learn }}
      reviewer: ${{ steps.filter.outputs.reviewer }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/ci-filters.json

  structure:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-structure.sh
      - run: node --test scripts/ci-selection.test.mjs scripts/ci-results.test.mjs scripts/prepare-contract-report.test.mjs
      - run: node --test scripts/prepare-pages-reports.test.mjs
      - run: python3 -m unittest discover -s scripts -p railway_preview_qr_test.py

  railway-config:
    name: Railway IaC
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .railway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: .railway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  reviewer:
    name: PR reviewer
    needs: changes
    if: ${{ needs.changes.outputs.reviewer == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pr-reviewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: tools/pr-reviewer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm test
      - run: npm run build

  server:
    name: Server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lovat_test
          POSTGRES_PASSWORD: lovat_test
          POSTGRES_DB: lovat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lovat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TEST_REPORT_PAGES_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: |
            apps/server/package-lock.json
            packages/db/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm run test:report:prepare
      - name: Test shared database against disposable PostgreSQL
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://lovat_test:lovat_test@127.0.0.1:5432/lovat_test
          LOVAT_DB_TEST: "1"
        run: |
          npm run db:validate
          npm run db:deploy
          npm run db:deploy
          npm run db:status
          npx --no-install prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
          node --test test/migrations.test.mjs
          npm run test:integration
          npm run test:practice-migration
      - name: Enforce unit-only Server coverage
        env:
          DATABASE_URL: postgresql://lovat_test:lovat_test@127.0.0.1:5432/lovat_test
          REDIS_URL: redis://127.0.0.1:6379/15
          LOVAT_DB_TEST: "1"
        run: npm run test:coverage:unit
      - name: Test Server behavior and enforce coverage against disposable services
        env:
          DATABASE_URL: postgresql://lovat_test:lovat_test@127.0.0.1:5432/lovat_test
          REDIS_URL: redis://127.0.0.1:6379/15
          LOVAT_DB_TEST: "1"
        run: npm run test:coverage
      - name: Upload Server coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: apps/server/test-report/coverage/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload Server test overview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: apps/server/test-report/
          retention-days: 14
          if-no-files-found: warn
      - name: Build server deployment image
        working-directory: .
        run: docker build -f apps/server/Dockerfile -t lovat-server:ci .

  worker:
    name: Worker
    needs: changes
    if: ${{ needs.changes.outputs.worker == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lovat_test
          POSTGRES_PASSWORD: lovat_test
          POSTGRES_DB: lovat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lovat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm --prefix ../../packages/db ci --include=dev
      - run: npm --prefix ../../packages/db run build
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - name: Test worker against disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://lovat_test:lovat_test@127.0.0.1:5432/lovat_test
          LOVAT_DB_TEST: "1"
        run: |
          npm --prefix ../../packages/db run db:deploy
          bun run test
      - name: Build worker deployment image
        working-directory: .
        run: docker build -f apps/worker/Dockerfile -t lovat-worker:ci .

  contracts:
    name: Cross-app contracts
    needs: changes
    if: ${{ needs.changes.outputs.contracts == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TEST_REPORT_PAGES_ENABLED == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lovat_test
          POSTGRES_PASSWORD: lovat_test
          POSTGRES_DB: lovat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lovat_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lovat_test:lovat_test@127.0.0.1:5432/lovat_test
      REDIS_URL: redis://127.0.0.1:6379/15
      LOVAT_DB_TEST: "1"
      DOTENV_CONFIG_PATH: /dev/null
      LOVAT_CONTRACT_OUTPUT_DIR: ${{ github.workspace }}/contract-report
      LOVAT_CONTRACT_COLLECTION_DIR: ${{ github.workspace }}/contract-report
      LOVAT_CONTRACT_SERVER_RESPONSE: ${{ github.workspace }}/contract-report/analysis.actual.json
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$LOVAT_CONTRACT_OUTPUT_DIR"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
      - name: Serialize Collection's retained reports
        id: collection
        working-directory: apps/collection
        run: |
          npm ci
          npm run test:unit -- --testPathPatterns crossAppContract 2>&1 | tee "$LOVAT_CONTRACT_OUTPUT_DIR/collection.log"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Upload and analyze through the real Server
        id: server
        working-directory: apps/server
        run: |
          npm ci
          npm --prefix ../../packages/db run db:deploy
          npm run test:integration -- test/crossAppContract.integration.test.ts 2>&1 | tee "$LOVAT_CONTRACT_OUTPUT_DIR/server.log"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.0
          channel: stable
      - name: Decode the actual Server response in Dashboard
        id: dashboard
        working-directory: apps/dashboard
        run: |
          flutter pub get
          flutter test test/cross_app_contract_test.dart 2>&1 | tee "$LOVAT_CONTRACT_OUTPUT_DIR/dashboard.log"
      - name: Retain stage outcomes and diagnostics
        if: always()
        env:
          CONTRACT_STEPS: ${{ toJSON(steps) }}
        run: node scripts/prepare-contract-report.mjs "$LOVAT_CONTRACT_OUTPUT_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-test-report
          path: ${{ github.workspace }}/contract-report/
          if-no-files-found: error
          retention-days: 14

  test-report:
    name: Publish test reports
    needs:
      [
        server,
        website,
        website-browser,
        learn,
        dashboard,
        dashboard-browser,
        gate,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TEST_REPORT_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: test-report-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Download this run's public reports
        uses: actions/download-artifact@v4
        with:
          pattern: "*-report"
          path: downloaded-test-reports
      - name: Stage app report directories
        run: node scripts/stage-pages-reports.mjs downloaded-test-reports public-test-reports
      - name: Validate and index reports from this run
        run: node scripts/prepare-pages-reports.mjs public-test-reports
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package all public test reports
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-test-reports/
      - name: Deploy test reports
        id: deployment
        uses: actions/deploy-pages@v4

  collection:
    name: Collection
    needs: changes
    if: ${{ needs.changes.outputs.collection == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TEST_REPORT_PAGES_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/collection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
          cache: npm
          cache-dependency-path: apps/collection/package-lock.json
      - run: npm ci
      - run: npm run preflight -- tooling
      - run: npm run check:dependencies
      - name: Audit Collection dependencies
        run: npm run --silent audit:dependencies > dependency-audit.json
      - name: Upload Collection dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-dependency-audit
          path: apps/collection/dependency-audit.json
          retention-days: 14
      - run: npm run test:ci
      - name: Upload Collection test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-test-report
          path: apps/collection/test-report/
          retention-days: 14
          if-no-files-found: error
      - run: npm run format:check
      - run: npm run lint
      - run: npm run ts:check

  dashboard-format:
    name: Dashboard format
    needs: changes
    if: ${{ needs.changes.outputs.dashboard == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.16.2
      - run: flutter --version
      - run: dart format --output=none --set-exit-if-changed .

  dashboard:
    name: Dashboard tests, analyze and build
    needs: changes
    if: ${{ needs.changes.outputs.dashboard == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TEST_REPORT_PAGES_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.4
      - run: flutter --version
      - run: flutter pub get
      - run: python3 tool/run_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-test-report
          path: apps/dashboard/test-report/
          retention-days: 14
          if-no-files-found: error
      - run: flutter analyze
      - run: flutter build web --release

  dashboard-browser:
    name: Dashboard Chrome journey
    needs: changes
    if: ${{ needs.changes.outputs.dashboard == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TEST_REPORT_PAGES_ENABLED == 'true') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.4
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: "141.0.7390.37"
          install-chromedriver: true
          install-dependencies: true
      - run: flutter pub get
      - run: python3 tool/run_browser.py
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-browser-report
          path: apps/dashboard/test-report/browser/
          retention-days: 14
          if-no-files-found: error

  website:
    name: Website
    needs: changes
    if: ${{ needs.changes.outputs.website == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TEST_REPORT_PAGES_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-coverage
          path: apps/website/test-report/coverage/
          retention-days: 14
      - name: Upload Website test overview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-test-report
          path: apps/website/test-report/
          retention-days: 14
          if-no-files-found: error
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  website-browser:
    name: Website browser
    needs: changes
    if: ${{ needs.changes.outputs.website == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TEST_REPORT_PAGES_ENABLED == 'true') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: npm ci
      - run: npx --no-install playwright install --with-deps --no-shell chromium
      - run: npm run test:image
      - name: Upload Website browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-report
          path: apps/website/playwright-report/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: website-browser-failure
          path: |
            apps/website/playwright-report/
            apps/website/test-results/
          retention-days: 7

  learn:
    name: Learn
    needs: changes
    if: ${{ needs.changes.outputs.learn == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TEST_REPORT_PAGES_ENABLED == 'true') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/learn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/learn/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:ci
      - run: npx --no-install playwright install --with-deps --no-shell chromium
      - run: npm run test:image
      - name: Upload Learn unit and coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learn-test-report
          path: apps/learn/test-report/
          retention-days: 14
          if-no-files-found: error
      - name: Upload Learn browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learn-browser-report
          path: apps/learn/playwright-report/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: learn-browser-failure
          path: |
            apps/learn/playwright-report/
            apps/learn/test-results/
          retention-days: 7

  gate:
    name: Monorepo CI
    if: ${{ always() }}
    needs:
      [
        changes,
        structure,
        railway-config,
        contracts,
        reviewer,
        server,
        worker,
        collection,
        dashboard-format,
        dashboard,
        dashboard-browser,
        website,
        website-browser,
        learn,
      ]
    runs-on: ubuntu-latest
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      PUBLISH_REPORTS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TEST_REPORT_PAGES_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Require every applicable job
        run: node scripts/ci-results.mjs
