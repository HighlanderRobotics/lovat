name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      worker: ${{ steps.filter.outputs.worker }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      collection: ${{ steps.filter.outputs.collection }}
      website: ${{ steps.filter.outputs.website }}
      learn: ${{ steps.filter.outputs.learn }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            worker:
              - 'apps/worker/**'
              - 'packages/db/**'
              - '.github/workflows/ci.yml'
            server:
              - 'apps/server/**'
              - 'packages/db/**'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'apps/dashboard/**'
              - '.github/workflows/ci.yml'
            collection:
              - 'apps/collection/**'
              - '.github/workflows/ci.yml'
            learn:
              - 'apps/learn/**'
              - '.github/workflows/ci.yml'
            website:
              - 'apps/website/**'
              - 'CHANGELOG.md'
              - '.github/workflows/ci.yml'

  structure:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-structure.sh

  server:
    name: Server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lovat_test
          POSTGRES_PASSWORD: lovat_test
          POSTGRES_DB: lovat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lovat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: |
            apps/server/package-lock.json
            packages/db/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm run test:report:prepare
      - name: Test shared database against disposable PostgreSQL
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://lovat_test:lovat_test@127.0.0.1:5432/lovat_test
          LOVAT_DB_TEST: "1"
        run: |
          npm run db:validate
          npm run db:deploy
          npm run db:deploy
          npm run db:status
          npx --no-install prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
          node --test test/migrations.test.mjs
          npm run test:integration
      - name: Enforce unit-only Server coverage
        env:
          DATABASE_URL: postgresql://lovat_test:lovat_test@127.0.0.1:5432/lovat_test
          REDIS_URL: redis://127.0.0.1:6379/15
          LOVAT_DB_TEST: "1"
        run: npm run test:coverage:unit
      - name: Test Server behavior and enforce coverage against disposable services
        env:
          DATABASE_URL: postgresql://lovat_test:lovat_test@127.0.0.1:5432/lovat_test
          REDIS_URL: redis://127.0.0.1:6379/15
          LOVAT_DB_TEST: "1"
        run: npm run test:coverage
      - name: Upload Server coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: apps/server/test-report/coverage/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload Server test overview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: apps/server/test-report/
          retention-days: 14
          if-no-files-found: warn
      - name: Build server deployment image
        working-directory: .
        run: docker build -f apps/server/Dockerfile -t lovat-server:ci .
      - name: Package public test report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TEST_REPORT_PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/server/test-report/

  worker:
    name: Worker
    needs: changes
    if: ${{ needs.changes.outputs.worker == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lovat_test
          POSTGRES_PASSWORD: lovat_test
          POSTGRES_DB: lovat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lovat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm --prefix ../../packages/db ci --include=dev
      - run: npm --prefix ../../packages/db run build
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - name: Test worker against disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://lovat_test:lovat_test@127.0.0.1:5432/lovat_test
          LOVAT_DB_TEST: "1"
        run: |
          npm --prefix ../../packages/db run db:deploy
          bun run test
      - name: Build worker deployment image
        working-directory: .
        run: docker build -f apps/worker/Dockerfile -t lovat-worker:ci .

  test-report:
    name: Publish test report
    needs: [server, gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TEST_REPORT_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: test-report-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy test report
        id: deployment
        uses: actions/deploy-pages@v4

  collection:
    name: Collection
    needs: changes
    if: ${{ needs.changes.outputs.collection == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/collection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
          cache: npm
          cache-dependency-path: apps/collection/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run ts:check
      - run: npm run build

  dashboard-format:
    name: Dashboard format
    needs: changes
    if: ${{ needs.changes.outputs.dashboard == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.16.2
      - run: flutter --version
      - run: dart format --output=none --set-exit-if-changed .

  dashboard:
    name: Dashboard analyze and build
    needs: changes
    if: ${{ needs.changes.outputs.dashboard == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.4
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --release

  website:
    name: Website
    needs: changes
    if: ${{ needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: npm ci
      - run: npm run test:changelog
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  learn:
    name: Learn
    needs: changes
    if: ${{ needs.changes.outputs.learn == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/learn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/learn/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build

  gate:
    name: Monorepo CI
    if: ${{ always() }}
    needs:
      [
        changes,
        structure,
        server,
        worker,
        collection,
        dashboard-format,
        dashboard,
        website,
        learn,
      ]
    runs-on: ubuntu-latest
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      STRUCTURE_RESULT: ${{ needs.structure.result }}
      SERVER_RESULT: ${{ needs.server.result }}
      WORKER_RESULT: ${{ needs.worker.result }}
      COLLECTION_RESULT: ${{ needs.collection.result }}
      WEBSITE_RESULT: ${{ needs.website.result }}
      LEARN_RESULT: ${{ needs.learn.result }}
      DASHBOARD_FORMAT_RESULT: ${{ needs.dashboard-format.result }}
      DASHBOARD_RESULT: ${{ needs.dashboard.result }}
    steps:
      - name: Require applicable jobs
        run: |
          for result in \
            "$CHANGES_RESULT" \
            "$STRUCTURE_RESULT" \
            "$SERVER_RESULT" \
            "$WORKER_RESULT" \
            "$COLLECTION_RESULT" \
            "$DASHBOARD_FORMAT_RESULT" \
            "$DASHBOARD_RESULT" \
            "$WEBSITE_RESULT" \
            "$LEARN_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Required job result: $result" >&2; exit 1 ;;
            esac
          done
