name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      collection: ${{ steps.filter.outputs.collection }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'apps/server/**'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'apps/dashboard/**'
              - '.github/workflows/ci.yml'
            collection:
              - 'apps/collection/**'
              - '.github/workflows/ci.yml'
            website:
              - 'apps/website/**'
              - '.github/workflows/ci.yml'

  structure:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-structure.sh

  server:
    name: Server
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  collection:
    name: Collection
    needs: changes
    if: ${{ needs.changes.outputs.collection == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/collection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/collection/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run ts:check

  dashboard-format:
    name: Dashboard format
    needs: changes
    if: ${{ needs.changes.outputs.dashboard == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.16.2
      - run: flutter --version
      - run: dart format --output=none --set-exit-if-changed .

  gate:
    name: Monorepo CI
    if: ${{ always() }}
    needs: [changes, structure, server, collection, dashboard-format]
    runs-on: ubuntu-latest
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      STRUCTURE_RESULT: ${{ needs.structure.result }}
      SERVER_RESULT: ${{ needs.server.result }}
      COLLECTION_RESULT: ${{ needs.collection.result }}
      DASHBOARD_RESULT: ${{ needs.dashboard-format.result }}
    steps:
      - name: Require applicable jobs
        run: |
          for result in \
            "$CHANGES_RESULT" \
            "$STRUCTURE_RESULT" \
            "$SERVER_RESULT" \
            "$COLLECTION_RESULT" \
            "$DASHBOARD_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Required job result: $result" >&2; exit 1 ;;
            esac
          done
