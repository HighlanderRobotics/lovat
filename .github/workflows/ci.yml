name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      collection: ${{ steps.filter.outputs.collection }}
      website: ${{ steps.filter.outputs.website }}
      learn: ${{ steps.filter.outputs.learn }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'apps/server/**'
              - 'packages/db/**'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'apps/dashboard/**'
              - '.github/workflows/ci.yml'
            collection:
              - 'apps/collection/**'
              - '.github/workflows/ci.yml'
            learn:
              - 'apps/learn/**'
              - '.github/workflows/ci.yml'
            website:
              - 'apps/website/**'
              - '.github/workflows/ci.yml'

  structure:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-structure.sh

  server:
    name: Server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lovat_test
          POSTGRES_PASSWORD: lovat_test
          POSTGRES_DB: lovat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lovat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: |
            apps/server/package-lock.json
            packages/db/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Test shared database against disposable PostgreSQL
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://lovat_test:lovat_test@127.0.0.1:5432/lovat_test
          LOVAT_DB_TEST: "1"
        run: |
          npm run db:validate
          npm run db:deploy
          npm run db:status
          npx --no-install prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
          node --test test/migrations.test.mjs
          npm run test:integration
      - name: Build server deployment image
        working-directory: .
        run: docker build -f apps/server/Dockerfile -t lovat-server:ci .

  collection:
    name: Collection
    needs: changes
    if: ${{ needs.changes.outputs.collection == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/collection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
          cache: npm
          cache-dependency-path: apps/collection/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run ts:check
      - run: npm run build

  dashboard-format:
    name: Dashboard format
    needs: changes
    if: ${{ needs.changes.outputs.dashboard == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.16.2
      - run: flutter --version
      - run: dart format --output=none --set-exit-if-changed .

  dashboard:
    name: Dashboard analyze and build
    needs: changes
    if: ${{ needs.changes.outputs.dashboard == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.4
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --release

  website:
    name: Website
    needs: changes
    if: ${{ needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  learn:
    name: Learn
    needs: changes
    if: ${{ needs.changes.outputs.learn == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/learn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/learn/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build

  gate:
    name: Monorepo CI
    if: ${{ always() }}
    needs: [changes, structure, server, collection, dashboard-format, dashboard, website, learn]
    runs-on: ubuntu-latest
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      STRUCTURE_RESULT: ${{ needs.structure.result }}
      SERVER_RESULT: ${{ needs.server.result }}
      COLLECTION_RESULT: ${{ needs.collection.result }}
      WEBSITE_RESULT: ${{ needs.website.result }}
      LEARN_RESULT: ${{ needs.learn.result }}
      DASHBOARD_FORMAT_RESULT: ${{ needs.dashboard-format.result }}
      DASHBOARD_RESULT: ${{ needs.dashboard.result }}
    steps:
      - name: Require applicable jobs
        run: |
          for result in \
            "$CHANGES_RESULT" \
            "$STRUCTURE_RESULT" \
            "$SERVER_RESULT" \
            "$COLLECTION_RESULT" \
            "$DASHBOARD_FORMAT_RESULT" \
            "$DASHBOARD_RESULT" \
            "$WEBSITE_RESULT" \
            "$LEARN_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Required job result: $result" >&2; exit 1 ;;
            esac
          done
