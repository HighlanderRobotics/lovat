name: Dashboard native integration
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_version:
        description: Version assigned by the release workflow before any candidate tests
        type: string
        default: ''
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
      - name: Assign release candidate version
        if: inputs.candidate_version != ''
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          python3 - <<'PYTHON'
          import os, pathlib, re
          path = pathlib.Path('apps/dashboard/pubspec.yaml')
          path.write_text(re.sub(r'^version: .*$', 'version: ' + os.environ['CANDIDATE_VERSION'], path.read_text(), flags=re.M))
          PYTHON
      - run: flutter pub get
        working-directory: apps/dashboard
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run synthetic native journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          cores: 2
          ram-size: 2048M
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: bash apps/dashboard/tool/run_native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-native-android-${{ github.sha }}
          path: apps/dashboard/test-report/native/
          retention-days: 14

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
      - name: Assign release candidate version
        if: inputs.candidate_version != ''
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          python3 - <<'PYTHON'
          import os, pathlib, re
          path = pathlib.Path('apps/dashboard/pubspec.yaml')
          path.write_text(re.sub(r'^version: .*$', 'version: ' + os.environ['CANDIDATE_VERSION'], path.read_text(), flags=re.M))
          PYTHON
      - run: flutter pub get
        working-directory: apps/dashboard
      - name: Create disposable simulator and run journey
        run: |
          device=$(python3 - <<'PYTHON'
          import json, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', '--json']))
          runtime = next(r['identifier'] for r in data['runtimes'] if r.get('isAvailable') and r['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-'))
          device_type = next(d['identifier'] for d in data['devicetypes'] if d['name'].startswith('iPhone'))
          print(subprocess.check_output(['xcrun', 'simctl', 'create', 'lovat-dashboard-ci', device_type, runtime], text=True).strip())
          PYTHON
          )
          trap 'xcrun simctl shutdown "$device" || true; xcrun simctl delete "$device"' EXIT
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          bash apps/dashboard/tool/run_native.sh ios "$device"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-native-ios-${{ github.sha }}
          path: apps/dashboard/test-report/native/
          retention-days: 14
