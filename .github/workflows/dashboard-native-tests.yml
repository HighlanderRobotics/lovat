name: Dashboard native integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
      - run: flutter pub get
        working-directory: apps/dashboard
      - name: Run synthetic native journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash apps/dashboard/tool/run_native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-native-results
          path: apps/dashboard/test-report/native/
          retention-days: 14
