name: Dashboard native integration
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_version:
        description: Version assigned by the release workflow before any candidate tests
        type: string
        default: ''
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.0
      - name: Assign release candidate version
        if: inputs.candidate_version != ''
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          python3 - <<'PYTHON'
          import os, pathlib, re
          path = pathlib.Path('apps/dashboard/pubspec.yaml')
          path.write_text(re.sub(r'^version: .*$', 'version: ' + os.environ['CANDIDATE_VERSION'], path.read_text(), flags=re.M))
          PYTHON
      - run: flutter pub get
        working-directory: apps/dashboard
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
          mkdir -p apps/dashboard/test-report/native
          stat /dev/kvm | tee apps/dashboard/test-report/native/kvm.txt
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run synthetic native journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          cores: 2
          ram-size: 2048M
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: bash apps/dashboard/tool/run_native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-native-android-${{ github.sha }}
          path: apps/dashboard/test-report/native/
          retention-days: 14

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.0
      - name: Assign release candidate version
        if: inputs.candidate_version != ''
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          python3 - <<'PYTHON'
          import os, pathlib, re
          path = pathlib.Path('apps/dashboard/pubspec.yaml')
          path.write_text(re.sub(r'^version: .*$', 'version: ' + os.environ['CANDIDATE_VERSION'], path.read_text(), flags=re.M))
          PYTHON
      - run: flutter pub get
        working-directory: apps/dashboard
      - name: Create disposable simulator and run journey
        run: |
          mkdir -p apps/dashboard/test-report/native
          xcrun simctl list --json > apps/dashboard/test-report/native/simulators.json
          python3 -m unittest discover -s apps/dashboard/tool -p test_create_test_simulator.py
          device=$(python3 apps/dashboard/tool/create_test_simulator.py)
          trap 'xcrun simctl shutdown "$device" || true; xcrun simctl delete "$device"' EXIT
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          bash apps/dashboard/tool/run_native.sh ios "$device"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-native-ios-${{ github.sha }}
          path: apps/dashboard/test-report/native/
          retention-days: 14

  desktop:
    name: ${{ matrix.platform }} release build
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, macos]
    runs-on: ${{ matrix.platform == 'macos' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.0
      - name: Install Linux native build libraries
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Assign release candidate version
        if: inputs.candidate_version != ''
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          python3 - <<'PYTHON'
          import os, pathlib, re
          path = pathlib.Path('apps/dashboard/pubspec.yaml')
          path.write_text(re.sub(r'^version: .*$', 'version: ' + os.environ['CANDIDATE_VERSION'], path.read_text(), flags=re.M))
          PYTHON
      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/dashboard
      - name: Build supported desktop target
        working-directory: apps/dashboard
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p test-report/native
          git rev-parse HEAD > test-report/native/source-sha.txt
          flutter --version > test-report/native/flutter-version.txt
          if [[ "$PLATFORM" == linux ]]; then
            flutter build linux --release 2>&1 | tee test-report/native/build.log
          else
            flutter build macos --config-only --release
            (cd macos && pod install)
            xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Release -derivedDataPath build/macos-validation CODE_SIGNING_ALLOWED=NO -jobs 2 build 2>&1 | tee test-report/native/build.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-${{ matrix.platform }}-build-${{ github.sha }}
          path: apps/dashboard/test-report/native/
          retention-days: 14
