name: Collection native candidate tests
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Choose the native journey to run
        type: choice
        required: true
        options: [android, ios]
        default: android
      candidate_run_id:
        description: GitHub Actions run containing a candidate APK built from this exact SHA
        required: false
      artifact_name:
        description: Artifact containing one standalone APK with localhost HTTP enabled for the fixture API
        required: false
  pull_request:
    types: [ready_for_review]
    branches: [main]
    paths:
      - .github/workflows/collection-native-tests.yml
      - apps/collection/scripts/test-native-ios.sh
      - apps/collection/scripts/check-native-ios-ledger.mjs
      - apps/collection/test/native/ios-ledger.test.mjs
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.id == github.event.repository.id) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test native input and state assertion guards
        if: github.event_name == 'workflow_dispatch'
        run: python3 -m unittest discover -s apps/collection/test/native -p '*_test.py'
      - name: Test iOS outage and retry evidence checks
        if: github.event_name == 'pull_request' || inputs.platform == 'ios'
        run: node --test apps/collection/test/native/ios-ledger.test.mjs
      - if: github.event_name == 'workflow_dispatch'
        env:
          PLATFORM: ${{ inputs.platform }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          ARTIFACT: ${{ inputs.artifact_name }}
        run: |
          if [[ "$PLATFORM" == ios && ( -n "$RUN_ID" || -n "$ARTIFACT" ) ]]; then
            echo "The iOS simulator builds its own synthetic candidate; APK inputs are Android-only."
            exit 1
          fi
          if [[ -n "$RUN_ID" || -n "$ARTIFACT" ]]; then
            [[ "$RUN_ID" =~ ^[0-9]+$ ]] && test -n "$ARTIFACT"
          fi
  build:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'android' && inputs.candidate_run_id == '' && inputs.artifact_name == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.6.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
        working-directory: apps/collection
      - name: Build standalone synthetic candidate from a fresh native project
        env:
          LOVAT_DISPOSABLE_BUILD: "1"
        run: |
          mkdir -p apps/collection/.maestro/results
          bash apps/collection/scripts/build-native-candidate.sh 2>&1 | tee apps/collection/.maestro/results/build-full.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: collection-native-candidate-${{ github.sha }}
          path: apps/collection/candidate/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: collection-native-build-logs-${{ github.sha }}
          path: apps/collection/.maestro/results/
          retention-days: 14
  android:
    needs: [validate, build]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.platform == 'android' && needs.validate.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.candidate_run_id != '' && inputs.artifact_name != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.candidate_run_id == ''
        with:
          name: collection-native-candidate-${{ github.sha }}
          path: candidate
      - name: Verify candidate source revision
        if: inputs.candidate_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          candidate_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .head_sha)
          test "$candidate_sha" = "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.candidate_run_id != ''
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.6.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - name: Install pinned Maestro
        run: |
          curl --fail --location https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip -o /tmp/maestro.zip
          unzip -q /tmp/maestro.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
          mkdir -p apps/collection/.maestro/results
          stat /dev/kvm | tee apps/collection/.maestro/results/kvm.txt
          test -r /dev/kvm && test -w /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          cores: 2
          ram-size: 2048M
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: bash apps/collection/scripts/test-native-candidate.sh candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: collection-native-results-${{ github.sha }}
          path: apps/collection/.maestro/results/
          retention-days: 14
  ios:
    needs: validate
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.platform == 'ios') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.id == github.event.repository.id) }}
    # Official GitHub-hosted public preview. Actionlint 1.7.12's static label
    # list predates it, so keep the published label as a fixed expression.
    runs-on: ${{ 'xcode-27' }}
    permissions:
      contents: read
    env:
      LOVAT_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.LOVAT_EXPECTED_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.6.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
        working-directory: apps/collection
      - name: Install pinned Maestro
        run: |
          curl --fail --location --max-time 180 https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip -o "$RUNNER_TEMP/maestro-ios.zip"
          unzip -q "$RUNNER_TEMP/maestro-ios.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Build and exercise the installed simulator candidate
        timeout-minutes: 50
        env:
          LOVAT_DISPOSABLE_BUILD: "1"
        run: bash apps/collection/scripts/test-native-ios.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: collection-native-ios-results-${{ env.LOVAT_EXPECTED_SOURCE_SHA }}
          path: apps/collection/.maestro/results/ios/
          retention-days: 14
