name: Dashboard build and deploy

on:
  workflow_dispatch:
  push:
    branches: [production]
    paths:
      - 'apps/dashboard/**'
      - '.github/workflows/dashboard-deploy.yml'

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Resolve candidate version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: version
        env:
          RELEASE: ${{ github.event_name == 'push' }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, re
          text = pathlib.Path('apps/dashboard/pubspec.yaml').read_text()
          match = re.search(r'^version: (\d+\.\d+\.\d+)\+(\d+)$', text, re.M)
          if not match:
              raise SystemExit('Expected a version with a numeric build number')
          build = int(match[2]) + (os.environ['RELEASE'] == 'true')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={match[1]}+{build}\n')
          PYTHON

  native:
    name: Test native candidate
    needs: candidate
    permissions:
      contents: read
    uses: ./.github/workflows/dashboard-native-tests.yml
    with:
      candidate_version: ${{ needs.candidate.outputs.version }}

  dry-run:
    name: Build-only dry run
    needs: native
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.41.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.6.0
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: '141.0.7390.37'
          install-chromedriver: true
          install-dependencies: true
      - name: Install dependencies
        working-directory: apps/dashboard
        run: flutter pub get
      - name: Test this versioned candidate
        working-directory: apps/dashboard
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          python3 tool/run_tests.py
          python3 tool/run_browser.py
          git rev-parse HEAD > test-report/source-sha.txt
          grep '^version:' pubspec.yaml > test-report/candidate-version.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dashboard-candidate-tests-${{ github.sha }}
          path: apps/dashboard/test-report/
          retention-days: 14
      - name: Build web
        working-directory: apps/dashboard
        run: flutter build web --release
      - name: Build APK
        working-directory: apps/dashboard
        run: flutter build apk --release
      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-dry-run-${{ github.sha }}
          path: |
            apps/dashboard/build/web
            apps/dashboard/build/app/outputs/flutter-apk/app-release.apk

  production:
    name: Production deploy
    needs: native
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.41.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.6.0
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: '141.0.7390.37'
          install-chromedriver: true
          install-dependencies: true
      - name: Install dependencies
        working-directory: apps/dashboard
        run: flutter pub get
      - name: Extract version
        id: version
        working-directory: apps/dashboard
        run: |
          current_version=$(grep 'version:' pubspec.yaml | cut -d+ -f1 | cut -d: -f2 | xargs)
          current_build=$(grep 'version:' pubspec.yaml | cut -d+ -f2)
          new_build=$((current_build + 1))
          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"
          echo "new_build=$new_build" >> "$GITHUB_OUTPUT"
      - name: Update version
        working-directory: apps/dashboard
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.current_version }}
          NEW_BUILD: ${{ steps.version.outputs.new_build }}
        run: |
          sed -i "s/version: .*/version: $CURRENT_VERSION+$NEW_BUILD/" pubspec.yaml
      - name: Test this versioned candidate
        working-directory: apps/dashboard
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          python3 tool/run_tests.py
          python3 tool/run_browser.py
          git rev-parse HEAD > test-report/source-sha.txt
          grep '^version:' pubspec.yaml > test-report/candidate-version.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dashboard-candidate-tests-${{ github.sha }}
          path: apps/dashboard/test-report/
          retention-days: 14
      - name: Build web
        working-directory: apps/dashboard
        run: flutter build web --release
      - name: Build APK
        working-directory: apps/dashboard
        run: flutter build apk --release
      - name: Generate Dashboard changelog
        id: changelog
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.current_version }}
          NEW_BUILD: ${{ steps.version.outputs.new_build }}
        run: |
          last_tag=$(git describe --tags --match 'dashboard-v*' --abbrev=0 2>/dev/null || true)
          if [[ -n "$last_tag" ]]; then
            changes=$(git log "$last_tag"..HEAD --pretty=format:'- %s' -20 -- apps/dashboard)
          else
            changes=$(git log HEAD --pretty=format:'- %s' -20 -- apps/dashboard)
          fi
          {
            echo "# Dashboard $CURRENT_VERSION+$NEW_BUILD"
            echo
            echo "## Changes"
            echo "$changes"
          } > changelog.md
          echo 'file=changelog.md' >> "$GITHUB_OUTPUT"
      - name: Commit version
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.current_version }}
          NEW_BUILD: ${{ steps.version.outputs.new_build }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add apps/dashboard/pubspec.yaml
          git commit -m "chore(dashboard): bump version to $CURRENT_VERSION+$NEW_BUILD [skip ci]"
      - name: Deploy to Netlify
        if: ${{ vars.DASHBOARD_HOSTING != 'railway' }}
        uses: nwtgck/actions-netlify@4cbaf4c08f1a7bfa537d6113472ef4424e4eb654 # v3.0.0
        with:
          publish-dir: './apps/dashboard/build/web'
          production-branch: production
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Dashboard ${{ steps.version.outputs.current_version }}+${{ steps.version.outputs.new_build }}'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
      - name: Deploy to Railway
        if: ${{ vars.DASHBOARD_HOSTING == 'railway' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DASHBOARD_PRODUCTION_TOKEN }}
        run: |
          npm install --global @railway/cli@4.35.0
          railway up --service dashboard --environment production --ci
      - name: Push version commit
        run: git push origin HEAD:production
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_VERSION: ${{ steps.version.outputs.current_version }}
          NEW_BUILD: ${{ steps.version.outputs.new_build }}
          CHANGELOG_FILE: ${{ steps.changelog.outputs.file }}
        run: |
          target_tag="dashboard-v$CURRENT_VERSION"
          apk_path='apps/dashboard/build/app/outputs/flutter-apk/app-release.apk'
          apk_name='app-release.apk'
          if gh release view "$target_tag" >/dev/null 2>&1; then
            gh release delete-asset "$target_tag" "$apk_name" --yes 2>/dev/null || true
            gh release edit "$target_tag" \
              --title "Dashboard $CURRENT_VERSION+$NEW_BUILD" \
              --notes-file "$CHANGELOG_FILE" \
              --draft
            gh release upload "$target_tag" "$apk_path#$apk_name"
          else
            gh release create "$target_tag" "$apk_path#$apk_name" \
              --target "$(git rev-parse HEAD)" \
              --title "Dashboard $CURRENT_VERSION+$NEW_BUILD" \
              --notes-file "$CHANGELOG_FILE" \
              --draft
          fi
