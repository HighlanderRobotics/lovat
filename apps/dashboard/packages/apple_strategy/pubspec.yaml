name: apple_strategy
description: App-local bridge to Apple's on-device Foundation Models.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: AppleStrategyPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: AppleStrategyPlugin
        sharedDarwinSource: true
