appId: com.frc8033.lovatcollection
---
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "^1234 in Q1$"
- tapOn: "Upload"
- extendedWaitUntil:
    notVisible: "Uploading"
    timeout: 20000
- assertNotVisible: "Upload"
- stopApp
- launchApp:
    clearState: false
- tapOn: "history"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: ".*1234.*"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "^(Qualifier 1, )?1234 • .+$"
      - assertVisible: "^1234 in Q1$"
- assertNotVisible: "Upload"
- tapOn: "Back"
- tapOn: "Back"
- tapOn: "settings"
- assertVisible: "Settings"
- openLink: "lovat-collection://history"
- assertVisible: "History"
