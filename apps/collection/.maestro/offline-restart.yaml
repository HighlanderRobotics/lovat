appId: com.frc8033.lovatcollection
---
- tapOn: "Scout this match"
- extendedWaitUntil:
    visible: "Start position Hub"
    timeout: 20000
- tapOn: "Start position Hub"
- tapOn: "Start match"
- tapOn: "Intake from depot"
- tapOn: "Undo"
- tapOn: "Intake from depot"
- tapOn: "End match"
- tapOn: "End match"
- scrollUntilVisible:
    element:
      text: "Submit"
    direction: DOWN
- tapOn: "Submit"
- extendedWaitUntil:
    visible: "Upload failed"
    timeout: 20000
- tapOn: "Done"
- stopApp
- launchApp:
    clearState: false
- tapOn: "history"
- tapOn:
    text: ".*1234.*"
- assertVisible: "Upload"
