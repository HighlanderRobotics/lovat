appId: com.frc8033.lovatcollection
---
- scrollUntilVisible:
    element:
      text: "Submit"
    direction: DOWN
- tapOn: "Submit"
- extendedWaitUntil:
    visible: "Upload failed"
    timeout: 20000
- tapOn: "Done"
- stopApp
- launchApp:
    clearState: false
- tapOn: "history"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: ".*1234.*"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "^(Qualifier 1, )?1234 • .+$"
      - assertVisible: "^1234 in Q1$"
- assertVisible: "Upload"
